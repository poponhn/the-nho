<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Thẻ nhớ</title>
<meta name="theme-color" content="#3348A8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-column phone app, max 520px, fixed bottom nav + center add button, bottom sheets, full-screen review */
:root{
  --bg:#F3F4F8;--surface:#FFFFFF;--surface-2:#E9ECF4;--ink:#161B2E;--muted:#5D6478;--line:#DADEEA;
  --accent:#3348A8;--accent-ink:#FFFFFF;--accent-soft:#E3E7F7;
  --warn:#9A4A06;--warn-soft:#FCEBD3;--danger:#B42318;--danger-soft:#FBE3E0;
  --ok:#1F7A4D;--ok-soft:#DDF1E6;--mid:#946200;--mid-soft:#FBF0D2;
  --f-ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1220;--surface:#181C2E;--surface-2:#20263B;--ink:#E7E9F3;--muted:#9AA0B8;--line:#2A3049;
  --accent:#8FA2F2;--accent-ink:#0E1638;--accent-soft:#232C52;
  --warn:#F2B35B;--warn-soft:#3A2A12;--danger:#F28B82;--danger-soft:#3D1D1A;
  --ok:#6FCF9B;--ok-soft:#183626;--mid:#EBC15A;--mid-soft:#3A2F12;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1220;--surface:#181C2E;--surface-2:#20263B;--ink:#E7E9F3;--muted:#9AA0B8;--line:#2A3049;
  --accent:#8FA2F2;--accent-ink:#0E1638;--accent-soft:#232C52;
  --warn:#F2B35B;--warn-soft:#3A2A12;--danger:#F28B82;--danger-soft:#3D1D1A;
  --ok:#6FCF9B;--ok-soft:#183626;--mid:#EBC15A;--mid-soft:#3A2F12;color-scheme:dark}
html{padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:84px;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-data);font-size:12px}
main{max-width:520px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(96px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.top h1{font-size:20px;font-weight:700;margin:0;letter-spacing:-.01em}
.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
h2{font-size:17px;font-weight:600;margin:0;text-wrap:balance}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grow{flex:1;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:6px}
.hero .big{font-size:44px;font-weight:700;letter-spacing:-.02em;line-height:1.05}
.sub{color:var(--muted);font-size:13px}
.banner{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:13px}
.banner button{margin-left:auto;font-weight:600;text-decoration:underline;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:500;min-height:42px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:6px 10px;min-height:34px;font-size:13px}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.block{width:100%}
.btn.big{min-height:52px;font-size:16px;font-weight:600;border-radius:14px}
.btn:disabled{opacity:.45}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.chip .c{font-family:var(--f-data);font-size:11px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.streak{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--warn);background:var(--warn-soft);padding:4px 10px;border-radius:999px}
.streak svg{width:14px;height:14px}
.split{display:flex;gap:14px;flex-wrap:wrap}
.split span{font-size:13px;color:var(--muted)}
.split b{color:var(--ink);font-weight:600}
.empty{text-align:center;padding:30px 16px;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty svg{width:56px;height:56px;color:var(--muted)}
.item{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);text-align:left;width:100%}
.item:first-child{border-top:0}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .n{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lv{display:flex;gap:2px;margin-top:4px}
.lv i{width:10px;height:4px;border-radius:2px;background:var(--line)}
.lv i.on{background:var(--accent)}
.meta{font-size:11px;color:var(--muted);white-space:nowrap;font-family:var(--f-data)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:20}
nav.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 72px 1fr 1fr;align-items:center;height:64px}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);height:100%;justify-content:center}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}
.fab{width:56px;height:56px;border-radius:18px;background:var(--accent);color:var(--accent-ink)!important;margin:0 auto;transform:translateY(-14px);box-shadow:0 6px 18px rgba(0,0,0,.18)}
.fab svg{width:28px!important;height:28px!important}
.scrim{position:fixed;inset:0;background:rgba(8,10,20,.48);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:94%;overflow-y:auto;border-radius:20px 20px 0 0;padding:10px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 2px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{padding:8px;border-radius:9px;font-size:14px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.field b{color:var(--ink);font-weight:600}
.err{color:var(--danger);font-size:13px}
.okmsg{color:var(--ok);font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:90;max-width:calc(100% - 32px);text-align:center}
.hint{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--muted)}
.hint code{font-family:var(--f-data);color:var(--ink);font-size:12px}
/* review screen */
.rv{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-left,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.rv .in{max-width:520px;width:100%;margin:0 auto;flex:1;display:flex;flex-direction:column;gap:12px;min-height:0}
.rvtop{display:flex;align-items:center;gap:10px}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.ib svg{width:22px;height:22px}
.prog{flex:1;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .25s}
.fc{flex:1;min-height:0;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px;text-align:left}
.fc .lab{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.fc .q{font-size:24px;font-weight:700;line-height:1.3;letter-spacing:-.01em;overflow-wrap:anywhere;white-space:pre-wrap}
.fc .q.long{font-size:18px;font-weight:600}
.fc .ask{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.fc hr{border:0;border-top:1px dashed var(--line);margin:4px 0;width:100%}
.fc .a{font-size:17px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.fc .note{font-size:14px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.tapflip{margin-top:auto;text-align:center;color:var(--muted);font-size:13px;padding-top:12px}
.rates{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.rate{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:60px;border-radius:14px;font-weight:600;font-size:15px;border:1px solid transparent}
.rate small{font-weight:500;font-size:11px;opacity:.85;font-family:var(--f-data)}
.rate.r1{background:var(--danger-soft);color:var(--danger)}
.rate.r2{background:var(--mid-soft);color:var(--mid)}
.rate.r3{background:var(--ok-soft);color:var(--ok)}
.undo{font-size:13px;color:var(--muted);text-decoration:underline;align-self:center}
.done{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;margin:auto 0}
.done .yay{font-size:40px;font-weight:700}
/* progress tab */
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:96px 1fr 40px;gap:8px;align-items:center;font-size:13px}
.bar .tr{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--accent);border-radius:5px}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.heat i{height:22px;border-radius:4px;background:var(--surface-2)}
.heat i.l1{background:color-mix(in srgb,var(--accent) 30%,var(--surface-2))}
.heat i.l2{background:color-mix(in srgb,var(--accent) 60%,var(--surface-2))}
.heat i.l3{background:var(--accent)}
.heat i.td{outline:2px solid var(--ink);outline-offset:-2px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat3 div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column}
.stat3 b{font-size:22px;font-weight:700}
.tprow{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.tprow:first-of-type{border-top:0}
.tprow input{padding:8px 10px}
.swatch{width:28px;height:28px;border-radius:8px;flex:none;border:0}
/* lookup */
.srch{position:relative}
.srch input{padding-left:40px;font-size:16px;min-height:48px;border-radius:14px}
.srch svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted);pointer-events:none}
.qbtn{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:15px;text-align:left}
.qbtn svg{width:20px;height:20px;flex:none}
.res{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.res .hd{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.res .ft{font-weight:700;font-size:16px;line-height:1.35;overflow-wrap:anywhere}
.res .bk{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.55}
.res .nt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.res .act{display:flex;gap:8px;justify-content:flex-end}
.badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.badge.lib{background:var(--accent-soft);color:var(--accent)}
.grp{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:6px 2px 0;display:flex;align-items:center;gap:6px}
.citem{display:flex;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line);text-align:left;width:100%}
.citem:first-child{border-top:0}
.citem .t{font-weight:500;flex:1;min-width:0;overflow-wrap:anywhere}
.citem svg{width:16px;height:16px;color:var(--muted);flex:none}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink);padding:2px 0}
.chk input{width:20px;height:20px;flex:none;margin:1px 0 0;accent-color:var(--accent)}
.chk span small{display:block;color:var(--muted);font-size:12.5px}
</style>
</head>

  <button data-act="tab" data-v="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/></svg>Học</button>
  <button data-act="tab" data-v="cards"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>Tra cứu</button>

  <button data-act="tab" data-v="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Tiến độ</button>

</div></nav>

<script>
'use strict';
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>dstr(new Date());
const addDays=(s,n)=>{const [y,m,d]=s.split('-').map(Number);return dstr(new Date(y,m-1,d+n))};
const daysBetween=(a,b)=>{const p=s=>{const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)};return Math.round((p(b)-p(a))/864e5)};
const vnDate=s=>{const [y,m,d]=s.split('-');return `${d}/${m}`};
const norm=s=>String(s||'').trim().toLowerCase().replace(/\s+/g,' ');
// bỏ dấu tiếng Việt để gõ không dấu vẫn tìm được
const fold=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'d').toLowerCase().replace(/[²³]/g,m=>m==='²'?'2':'3');
const LIB=(window.THENHO_LIB||[]),LIBG=(window.THENHO_LIB_GROUPS||{});
let toastT;function toast(m){let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=m;clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),2600)}

/* Lịch ôn theo hộp: hộp càng cao thì càng lâu mới hỏi lại (ngày) */
const INT={1:1,2:3,3:7,4:14,5:30,6:60};
const MAXBOX=6;
const PALETTE=['#3348A8','#1F7A4D','#B4530F','#9B2C8F','#0E7C86','#7A5C12','#B42318','#5B6478'];
const DEF_SETTINGS=()=>({newPerDay:10,reverse:'off',topics:[
  {id:'phaply',name:'Pháp lý',color:'#3348A8'},
  {id:'ketcau',name:'Kết cấu',color:'#1F7A4D'},
  {id:'tienganh',name:'Tiếng Anh kỹ thuật',color:'#B4530F'},
  {id:'khac',name:'Khác',color:'#5B6478'}]});

/* ---------- storage: IndexedDB on this phone ---------- */
const IDB=(()=>{let p;
  const open=()=>p||(p=new Promise((res,rej)=>{const r=indexedDB.open('thenho',1);
    r.onupgradeneeded=()=>{const db=r.result;db.createObjectStore('cards',{keyPath:'id'});db.createObjectStore('meta')};
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
  const tx=async(store,mode,fn)=>{const db=await open();return new Promise((res,rej)=>{const t=db.transaction(store,mode);const s=t.objectStore(store);const out=fn(s);t.oncomplete=()=>res(out instanceof IDBRequest?out.result:out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})};
  return{
    all:s=>tx(s,'readonly',st=>st.getAll()),
    get:(s,k)=>tx(s,'readonly',st=>st.get(k)),
    put:(s,v,k)=>tx(s,'readwrite',st=>k===undefined?st.put(v):st.put(v,k)),
    del:(s,k)=>tx(s,'readwrite',st=>st.delete(k)),
    putMany:(s,arr)=>tx(s,'readwrite',st=>{arr.forEach(v=>st.put(v))}),

  }})();

function remoteMeta(m){
  let changed=false,needPush=!m;
  if(m){
    const L=Object.assign({},S.log);
    Object.entries(m.log||{}).forEach(([k,v])=>{const a=L[k];if(!a||(a.n||0)<(v.n||0)||((a.n||0)===(v.n||0)&&(a.new||0)<(v.new||0))){L[k]=v;changed=true}});
    Object.entries(S.log).forEach(([k,v])=>{const r=(m.log||{})[k];if(!r||(r.n||0)<(v.n||0))needPush=true});
    S.log=L;
    if((m.upd||0)>(S.mupd||0)&&m.settings){S.settings=Object.assign(DEF_SETTINGS(),m.settings);S.mupd=m.upd;changed=true;IDB.put('meta',S.mupd,'mupd').catch(()=>{})}

function score(q,toks,e,isLib){
  const f=fold(e.front),b=fold(e.back),n=fold(e.note),tg=isLib?fold(e.tags):'';
  const all=f+' '+b+' '+n+' '+tg;
  if(!toks.every(t=>all.includes(t)))return 0;
  let sc=1;if(f.includes(q))sc+=100;if(f.startsWith(q))sc+=30;
  toks.forEach(t=>{if(f.includes(t))sc+=10;else if(tg.includes(t))sc+=6;else if(b.includes(t))sc+=3;else sc+=1});
  if(isLib&&tg.includes(q))sc+=20;
  return sc;
}

function lookupResults(){

/* Đọc khối văn bản dán vào: keyword | định nghĩa | note | chủ đề */
function parseBulk(text,defTopic){
  const out=[],bad=[];let prev=null;
  const findTopic=name=>S.settings.topics.find(t=>norm(t.name)===norm(name));
  text.replace(/\r/g,'').split('\n').forEach((raw,i)=>{
    let line=raw.replace(/\*\*/g,'').trim();
    if(!line||/^```/.test(line))return;
    line=line.replace(/^([-*•]|\d+[.)])\s+/,'');
    let parts=null;
    if(line.includes('|'))parts=line.split('|');else if(raw.includes('\t'))parts=raw.split('\t');
    if(parts){parts=parts.map(s=>s.trim());
      if(parts.length&&parts[0]===''&&raw.trim().startsWith('|'))parts.shift();
      if(parts.length&&parts[parts.length-1]===''&&raw.trim().endsWith('|'))parts.pop();
      if(/^[-:\s]+$/.test(parts.join('')))return; // dòng kẻ của bảng markdown
      const [f,b,n,tp]=parts;
      if(!f||!b){bad.push(i+1);prev=null;return}
      if(norm(f)==='keyword'&&/định nghĩa|dinh nghia/i.test(b))return; // dòng tiêu đề
      prev={front:f,back:b,note:n||'',topicName:tp||'',last:n?'note':'back'};out.push(prev);
    }else if(prev){prev[prev.last]+=(prev[prev.last]?'\n':'')+line}
    else bad.push(i+1);
  });
  const newTopics=new Set();
  out.forEach(c=>{if(c.topicName){const t=findTopic(c.topicName);if(t)c.topic=t.id;else{c.topic='new:'+norm(c.topicName);newTopics.add(c.topicName)}}else c.topic=defTopic});
  // trùng: so với thẻ đã có và với các dòng phía trên
  const seen=new Set(S.cards.map(c=>c.topic+'\u0001'+norm(c.front)));let dup=0;
  const keep=out.filter(c=>{const k=c.topic+'\u0001'+norm(c.front);if(seen.has(k)){dup++;return false}seen.add(k);return true});
  return{cards:keep,bad,dup,newTopics:[...newTopics]};
}
function paintBulk(){
  const r=parseBulk($('#bT').value,$('#bTp').value);E.parsed=r;
  const msg=[];
  if(r.cards.length)msg.push(`<span class="okmsg">Đọc được ${r.cards.length} thẻ.</span>`);
  if(r.dup)msg.push(`${r.dup} thẻ trùng keyword sẽ bỏ qua.`);
  if(r.newTopics.length)msg.push(`Sẽ tạo chủ đề mới: ${r.newTopics.map(esc).join(', ')}.`);
  if(r.bad.length)msg.push(`<span class="err">Dòng ${r.bad.slice(0,6).join(', ')}${r.bad.length>6?'…':''} thiếu keyword hoặc định nghĩa, sẽ bỏ qua.</span>`);
  $('#bInfo').innerHTML=msg.join(' ');
  const g=$('#bGo');g.disabled=!r.cards.length;g.textContent=r.cards.length?`Thêm ${r.cards.length} thẻ`:'Thêm thẻ';
}
async function saveBulk(){
  const r=E.parsed;if(!r||!r.cards.length)return;

  r.newTopics.forEach(name=>{const t={id:uid(),name,color:PALETTE[S.settings.topics.length%PALETTE.length]};S.settings.topics.push(t);map['new:'+norm(name)]=t.id});

}

/* ---------- review session ---------- */
let R=null;
function pickRev(){const m=S.settings.reverse;return m==='all'?true:m==='mix'?Math.random()<.5:false}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startSession(extra){
  const d=today(),t=S.topic;
  let due=[],news=[];
  if(extra)news=S.cards.filter(c=>inTopic(c,t)&&isNew(c)).sort((a,b)=>a.created-b.created).slice(0,extra);
  else{
    due=shuffle(S.cards.filter(c=>inTopic(c,t)&&isDue(c,d))).sort((a,b)=>a.due<b.due?-1:a.due>b.due?1:0);
    news=S.cards.filter(c=>inTopic(c,t)&&isNew(c)).sort((a,b)=>a.created-b.created).slice(0,counts(t).newToday);
  }
  // xen thẻ mới vào giữa thẻ ôn lại cho đỡ nhàm
  const q=due.map(c=>({id:c.id}));let step=news.length?Math.max(1,Math.floor(q.length/news.length)):1;
  news.forEach((c,i)=>q.splice(Math.min(q.length,(i+1)*step+i),0,{id:c.id}));
  if(!q.length){toast('Không có thẻ nào để ôn');return}
  q.forEach(x=>x.rev=pickRev());
  const tt=$('.toast');if(tt)tt.remove();
  R={q,i:0,flipped:false,done:0,total:q.length,stats:{1:0,2:0,3:0},hist:[]};
  const el=document.createElement('div');el.className='rv';el.id='rv';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');el.setAttribute('aria-label','Ôn thẻ');
  document.body.appendChild(el);document.body.style.overflow='hidden';paintReview();
}
function paintReview(){
  const el=$('#rv');if(!el||!R)return;
  const it=R.q[R.i];
  const pct=(R.done/R.total*100).toFixed(1);
  const top=`<div class="rvtop"><button class="ib" data-act="endReview" aria-label="Dừng ôn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <span class="prog" aria-hidden="true"><i style="width:${pct}%"></i></span><span class="mono num">${R.done}/${R.total}</span></div>`;
  if(!it){
    const s=R.stats;
    el.innerHTML=`<div class="in">${top}<div class="done">
      <span class="streak">${flame}${streak()} ngày liên tục</span>
      <span class="yay">Xong!</span>
      <span class="sub">Ôn ${s[1]+s[2]+s[3]} thẻ · nhớ ${s[3]} · lơ mơ ${s[2]} · quên ${s[1]}</span>
      <span class="sub">Thẻ quên sẽ hỏi lại vào ngày mai.</span>
      <button class="btn pri big" data-act="endReview" style="min-width:200px;margin-top:8px">Về màn hình chính</button></div></div>`;
    return;
  }
  const c=S.cards.find(x=>x.id===it.id);
  if(!c){R.q.splice(R.i,1);R.total=Math.max(R.done,R.total-1);paintReview();return}
  const t=topicOf(c.topic),qTxt=it.rev?c.back:c.front,aTxt=it.rev?c.front:c.back;
  const long=qTxt.length>70;
  const lab=`<div class="lab"><span class="dot" style="background:${t.color}"></span>${esc(t.name)}${isNew(c)&&!it.again?' · <b style="color:var(--accent)">thẻ mới</b>':''}${it.again?' · hỏi lại':''}${it.rev?' · hỏi ngược':''}</div>`;
  let body;
  if(!R.flipped){
    body=`<button class="fc" data-act="flip" aria-label="Lật thẻ">${lab}<span class="ask">${it.rev?'Keyword nào?':'Định nghĩa là gì?'}</span><span class="q${long?' long':''}">${esc(qTxt)}</span>
      <span class="tapflip">Nghĩ ra đáp án rồi chạm để lật thẻ</span></button>
      <button class="btn pri big block" data-act="flip">Lật thẻ</button>`;
  }else{
    const p=k=>it.again?'mai':whenTxt(nextPreview(c,k));
    body=`<div class="fc">${lab}<span class="q${long?' long':''}" style="font-size:${long?16:19}px;color:var(--muted);font-weight:600">${esc(qTxt)}</span><hr>
      <span class="a" style="${it.rev?'font-size:22px;font-weight:700':''}">${esc(aTxt)}</span>
      ${c.note?`<span class="note">${esc(c.note)}</span>`:''}</div>
      <div class="rates"><button class="rate r1" data-act="rate" data-k="1">Quên<small>hỏi lại</small></button>
        <button class="rate r2" data-act="rate" data-k="2">Lơ mơ<small>${p(2)}</small></button>
        <button class="rate r3" data-act="rate" data-k="3">Nhớ<small>${p(3)}</small></button></div>`;
  }
  el.innerHTML=`<div class="in">${top}${body}${R.hist.length?'<button class="undo" data-act="undo">Hoàn tác thẻ vừa chấm</button>':''}</div>`;
}
async function rate(k){
  const it=R.q[R.i];const c=S.cards.find(x=>x.id===it.id);if(!c)return;
  const d=today();
  R.hist.push({card:Object.assign({},c),log:S.log[d]?JSON.parse(JSON.stringify(S.log[d])):null,q:R.q.slice(),i:R.i,
    done:R.done,total:R.total,stats:Object.assign({},R.stats)});
  if(R.hist.length>20)R.hist.shift();
  const n=Object.assign({},c);
  if(!it.again){
    const wasNew=isNew(c);
    n.reviews=(n.reviews||0)+1;n.last=d;
    if(k===1){n.box=1;n.due=addDays(d,1);n.lapses=(n.lapses||0)+1}
    else if(k===2){n.box=Math.max(1,n.box||0);n.due=addDays(d,Math.max(1,Math.ceil(INT[n.box]/2)))}
    else{n.box=wasNew?2:Math.min(MAXBOX,n.box+1);n.due=addDays(d,INT[n.box])}
    const L=S.log[d]||(S.log[d]={n:0,new:0});L.n=(L.n||0)+1;if(wasNew)L.new=(L.new||0)+1;
    R.stats[k]++;
  }
  // thẻ quên: hỏi lại cuối buổi cho chắc (lần hỏi lại không làm thẻ lên hộp)
  if(k===1){R.q.push({id:c.id,rev:it.rev,again:true});R.total++}
  R.done++;R.i++;R.flipped=false;
  if(!it.again){const i=S.cards.findIndex(x=>x.id===n.id);if(i>=0)S.cards[i]=n}
  paintReview();
  if(!it.again){await store.putCard(n);store.saveLog()}
}
async function undo(){
  const h=R.hist.pop();if(!h)return;
  const d=today();
  const i=S.cards.findIndex(x=>x.id===h.card.id);if(i>=0)S.cards[i]=h.card;
  if(h.log)S.log[d]=h.log;else delete S.log[d];
  R.q=h.q;R.i=h.i;R.done=h.done;R.total=h.total;R.stats=h.stats;R.flipped=false;
  paintReview();
  await store.putCard(h.card);store.saveLog();
}
function endReview(){const el=$('#rv');if(el)el.remove();document.body.style.overflow='';R=null;render()}

/* ---------- backup / restore / export ---------- */
async function saveFile(filename,text,type){
  try{const blob=new Blob([text],{type:type||'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast('Đã lưu vào thư mục Tải xuống');return true}
  catch(e){toast('Không lưu được file');return false}
}
const canShareFiles=()=>{try{return !!(navigator.canShare&&navigator.canShare({files:[new File(['x'],'a.txt',{type:'text/plain'})]}))}catch(e){return false}};
async function shareFile(base,text,exts){
  // Android chỉ cho chia sẻ một số loại file: thử .json trước, không được thì gửi .txt (nội dung y hệt)
  for(const [ext,type] of (exts||[['json','application/json'],['txt','text/plain']])){
    const f=new File([text],`${base}.${ext}`,{type});
    let ok=false;try{ok=!!(navigator.canShare&&navigator.canShare({files:[f]}))}catch(e){}
    if(!ok)continue;
    try{await navigator.share({files:[f],title:f.name});return 'shared'}catch(e){return e&&e.name==='AbortError'?'cancel':'fail'}
  }
  return 'unsupported';
}
async function backup(){
  const data={app:'the-nho',version:1,exported:new Date().toISOString(),settings:S.settings,log:S.log,cards:S.cards};
  const text=JSON.stringify(data),base=`sao-luu-the-nho-${today()}`;
  const saved=await saveFile(base+'.json',text);
  if(saved){S.lastBackup=Date.now();IDB.put('meta',S.lastBackup,'lastBackup').catch(()=>{});render()}
  if(!canShareFiles())return;
  askCloud(base,text,saved);
}
function askCloud(base,text,saved){
  const sc=document.createElement('div');sc.className='scrim';sc.id='cloudAsk';
  sc.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="caT"><div class="grab"></div>
    <h2 id="caT">${saved?'Đã lưu vào máy':'Chưa lưu được vào máy'}</h2>
    <div class="sub">${saved?'File nằm trong thư mục Tải xuống. ':''}Gửi thêm một bản lên OneDrive để lỡ mất máy vẫn còn?</div>
    <div class="sub">Bảng chia sẻ mở ra thì chọn <b>OneDrive</b>, rồi chọn thư mục lưu.</div>
    <button class="btn pri block" id="caYes" style="min-height:48px">Có, gửi lên OneDrive</button>
    <button class="btn block" id="caNo">Không, chỉ lưu trong máy</button></div>`;
  document.body.appendChild(sc);
  const close=()=>sc.remove();
  sc.addEventListener('click',e=>{if(e.target===sc)close()});
  $('#caNo').onclick=close;
  $('#caYes').onclick=async()=>{close();const r=await shareFile(base,text);
    if(r==='shared'){toast('Đã gửi bản sao lưu');if(!saved){S.lastBackup=Date.now();IDB.put('meta',S.lastBackup,'lastBackup').catch(()=>{});render()}}
    else if(r!=='cancel')toast('Không mở được bảng chia sẻ. File vẫn nằm trong Tải xuống.')};
}
async function restore(file){
  let d;try{d=JSON.parse(await file.text())}catch(e){toast('File không đọc được');return}
  if(!d||d.app!=='the-nho'||!Array.isArray(d.cards)){toast('Đây không phải file sao lưu của Thẻ nhớ');return}
  // gộp chủ đề theo tên
  const tmap={};
  (d.settings&&d.settings.topics||[]).forEach(t=>{
    let m=S.settings.topics.find(x=>x.id===t.id)||S.settings.topics.find(x=>norm(x.name)===norm(t.name));
    if(!m){m={id:t.id,name:t.name,color:t.color||PALETTE[S.settings.topics.length%PALETTE.length]};S.settings.topics.push(m)}
    tmap[t.id]=m.id});
  const have=new Set(S.cards.map(c=>c.id));
  const arr=d.cards.filter(c=>c&&c.id&&!c.del&&!have.has(c.id)&&c.front).map(c=>Object.assign({},c,{topic:tmap[c.topic]||(S.settings.topics.some(t=>t.id===c.topic)?c.topic:'khac')}));
  if(!S.settings.topics.some(t=>t.id==='khac')&&arr.some(c=>c.topic==='khac'))S.settings.topics.push({id:'khac',name:'Khác',color:'#5B6478'});
  Object.entries(d.log||{}).forEach(([k,v])=>{const L=S.log[k];if(!L||(L.n||0)<(v.n||0))S.log[k]=v});
  store.saveSettings();store.saveLog();
  await store.putCards(arr);toast(`Đã khôi phục ${arr.length} thẻ`);render();
}
async function exportTxt(){
  if(!S.cards.length){toast('Chưa có thẻ nào để xuất');return}
  const one=s=>String(s||'').replace(/\s*\n\s*/g,' / ').replace(/\|/g,'/');
  const list=S.cards.slice().sort((a,b)=>topicOf(a.topic).name.localeCompare(topicOf(b.topic).name,'vi')||a.front.localeCompare(b.front,'vi'));
  const text='keyword | định nghĩa | note | chủ đề\n'+list.map(c=>[c.front,c.back,c.note,topicOf(c.topic).name].map(one).join(' | ')).join('\n')+'\n';
  const base=`the-nho-${today()}`;
  if(canShareFiles()){const r=await shareFile(base,text,[['txt','text/plain']]);if(r==='shared'||r==='cancel')return}
  saveFile(base+'.txt',text,'text/plain');
}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act;
  if(a==='tab'){S.view=el.dataset.v;window.scrollTo(0,0);render();return}
  if(a==='add'){openSheet(null,'one');return}
  if(a==='addBulk'){openSheet(null,'bulk');return}
  if(a==='close'){closeSheet();return}
  if(a==='mode'){E.mode=el.dataset.v;document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===E.mode));$('#mOne').hidden=E.mode!=='one';$('#mBulk').hidden=E.mode!=='bulk';(E.mode==='bulk'?$('#bT'):$('#fF')).focus();return}
  if(a==='saveOne'){saveOne(!!el.dataset.more);return}
  if(a==='saveBulk'){saveBulk();return}
  if(a==='edit'){const c=S.cards.find(x=>x.id===el.dataset.id);if(c)openSheet(c);return}
  if(a==='delCard'){if(!E.arm){E.arm=true;el.classList.add('armed');el.textContent='Bấm lần nữa để xóa';setTimeout(()=>{if(E&&E.arm){E.arm=false;el.classList.remove('armed');el.textContent='Xóa thẻ'}},3000);return}
    const id=E.orig.id;closeSheet();await store.delCard(id);toast('Đã xóa thẻ');render();return}
  if(a==='resetCard'){const c=Object.assign({},E.orig,{box:0,due:''});delete c.ref;await store.putCard(c);closeSheet();toast('Thẻ sẽ được ôn như thẻ mới');render();return}
  if(a==='pickTopic'){S.topic=el.dataset.v;render();return}
  if(a==='goLookup'){S.view='cards';window.scrollTo(0,0);render();const q=$('#q');q&&q.focus();return}
  if(a==='scope'){S.scope=el.dataset.v;S.open={};render();return}
  if(a==='toggle'){const k=el.dataset.k;if(S.open[k])delete S.open[k];else S.open[k]=1;$('#results').innerHTML=lookupResults();return}
  if(a==='libAdd'){const e=LIB.find(x=>x.id===el.dataset.id);if(!e||inMine(e.id))return;
    let t=S.settings.topics.find(x=>norm(x.name)===norm(libInfo(e).name));
    if(!t){t={id:uid(),name:libInfo(e).name,color:libInfo(e).color};S.settings.topics.push(t);store.saveSettings()}
    await store.putCard(makeCard({front:e.front,back:e.back,note:e.note,topic:t.id,libId:e.id}));
    toast('Đã thêm vào bộ thẻ, sẽ có trong lịch ôn');$('#results').innerHTML=lookupResults();return}
  if(a==='listTopic'){S.listTopic=el.dataset.v;$('#results').innerHTML=lookupResults();return}
  if(a==='start'){startSession(0);return}
  if(a==='extra'){startSession(5);return}
  if(a==='flip'){if(R){R.flipped=true;paintReview()}return}
  if(a==='rate'){if(R&&R.flipped)rate(+el.dataset.k);return}
  if(a==='undo'){undo();return}
  if(a==='endReview'){endReview();return}
  if(a==='loadSample'){loadSample();return}
  if(a==='clearSample'){clearSample();return}
  if(a==='backup'){backup();return}
  if(a==='restore'){$('#restoreIn').value='';$('#restoreIn').click();return}
  if(a==='exportTxt'){exportTxt();return}
  if(a==='addTopic'){const v=$('#newTopic').value.trim();if(!v){$('#newTopic').focus();return}
    if(S.settings.topics.some(t=>norm(t.name)===norm(v))){toast('Đã có chủ đề này');return}
    S.settings.topics.push({id:uid(),name:v,color:PALETTE[S.settings.topics.length%PALETTE.length]});store.saveSettings();render();toast('Đã thêm chủ đề');return}
  if(a==='delTopic'){const id=el.dataset.id,n=S.cards.filter(c=>c.topic===id).length;
    if(S.settings.topics.length<=1){toast('Cần giữ ít nhất một chủ đề');return}
    if(n){toast(`Chủ đề còn ${n} thẻ. Chuyển thẻ sang chủ đề khác trước rồi mới xóa được.`);return}
    if(el.dataset.armed!=='1'){el.dataset.armed='1';el.classList.add('armed');el.textContent='Chắc chưa?';setTimeout(()=>{el.dataset.armed='';el.classList.remove('armed');el.textContent='Xóa'},3000);return}
    S.settings.topics=S.settings.topics.filter(t=>t.id!==id);if(S.topic===id)S.topic='all';if(S.listTopic===id)S.listTopic='all';store.saveSettings();render();return}
  if(a==='recolor'){const t=S.settings.topics.find(x=>x.id===el.dataset.id);const i=PALETTE.indexOf(t.color);t.color=PALETTE[(i+1)%PALETTE.length];store.saveSettings();render();return}
  if(a==='syncOn'){S.sync.on=true;IDB.put('meta',true,'syncOn').catch(()=>{});S.sync.state='off';render();
    if(await startSync())window.TheNhoSync.signIn();return}
  if(a==='syncLogin'){if(window.TheNhoSync)window.TheNhoSync.signIn();return}
  if(a==='syncNow'){if(window.TheNhoSync){window.TheNhoSync.resync();toast('Đang đồng bộ…')}return}
  if(a==='syncOff'){S.sync.on=false;IDB.put('meta',false,'syncOn').catch(()=>{});try{window.TheNhoSync&&await window.TheNhoSync.signOut()}catch(e){}S.sync.state='off';render();toast('Đã tắt đồng bộ trên máy này');return}
  if(a==='wipe'){if(el.dataset.armed!=='1'){el.dataset.armed='1';el.classList.add('armed');el.textContent='Bấm lần nữa để xóa hết';setTimeout(()=>{if(el.isConnected){el.dataset.armed='';el.classList.remove('armed');el.textContent='Xóa tất cả'}},3000);return}
    const now=Date.now(),tombs=S.cards.map((c,k)=>({id:c.id,del:true,upd:now+k}));
    try{await IDB.putMany('cards',tombs)}catch(err){}
    S.cards=[];S.tombs=S.tombs.concat(tombs);syncPushMany(tombs);toast(S.sync.on?'Đã xóa toàn bộ thẻ trên mọi máy đồng bộ':'Đã xóa toàn bộ thẻ');render();return}
});
$('#restoreIn').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(f)restore(f)});
document.addEventListener('keydown',e=>{
  if(R&&$('#rv')){
    if(e.key===' '||e.key==='Enter'){if(!R.flipped&&R.q[R.i]){e.preventDefault();R.flipped=true;paintReview()}return}
    if(R.flipped&&['1','2','3'].includes(e.key)){rate(+e.key);return}
    if(e.key==='Escape'){endReview();return}
  }else if(e.key==='Escape'&&$('#sheet'))closeSheet();
});
window.addEventListener('popstate',()=>{if($('#rv'))endReview();else if($('#sheet'))closeSheet()});
